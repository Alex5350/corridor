# SonarScanner properties for the Corridor repo.
# Scanning runs OUTSIDE CI by choice: CI (see .github/workflows/ci.yml) stays
# fast and dependency free, and analysis happens from a developer machine or
# a scheduled job via:
#   sonar-scanner -Dsonar.host.url=https://sonar.example.com -Dsonar.login=...
# To analyze the C# projects, build first with the SonarScanner for .NET:
#   dotnet sonarscanner begin /k:Alex5350_corridor
#   dotnet build Corridor.slnx
#   dotnet sonarscanner end

sonar.projectKey=Alex5350_corridor
sonar.projectName=Corridor
sonar.projectVersion=1.0.0

# Layout: sources in src (SPA included as TypeScript/React sources), tests in
# the separate tests tree.
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/wwwroot/lib/**,**/bin/**,**/obj/**,**/dist/**,**/*.min.js,**/*.min.css

# C# plugin: coverage and test results when a scan is run after a build.
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/**/*.trx
sonar.coverage.exclusions=**/*.cshtml,**/wwwroot/**,**/Program.cs

# TypeScript/JavaScript side (Corridor.Spa): skip vendored and generated code.
sonar.typescript.tsconfigPaths=src/Corridor.Spa/tsconfig.json
sonar.javascript.lcov.reportPaths=src/Corridor.Spa/coverage/lcov.info

# Server binding stays OUT of this file so the properties are portable.
# Example for a local scan (commented):
# sonar.host.url=https://sonar.example.com
