AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Corridor ECS skeleton: VPC-lite networking, one ECS cluster, Fargate task
  definitions and services for portal, oktasim and legacy behind a public
  ALB (listener 80 forwarding to the portal target group on port 5200, with
  path rules for the other two). This is an honest skeleton: container
  images, the execution role and Secrets Manager entries must exist before
  deployment. DATABASE: bring your own SQL Server (RDS for SQL Server or an
  on-prem server reached over VPN). This template deliberately does NOT
  create a database instance.

# ---------------------------------------------------------------------------
# Bring your own SQL Server:
#   * point the ConnectionStrings__Corridor placeholders at your SQL host
#   * create the Secrets Manager entries named below (names only, no values
#     are stored in this file):
#       corridor/db/sa-password            the SQL login password
#       corridor/portal/client-secret      okta-sim client secret for portal
#       corridor/legacy/client-secret      okta-sim client secret for legacy
#   * apply db/sql scripts 001, 002 and seed/003 with sqlcmd before boot
# ---------------------------------------------------------------------------

Metadata:
  cfn-lint:
    config:
      # Skeleton template: role and image checks are site specific.
      ignore_checks:
        - E3032

Parameters:
  VpcCidr:
    Type: String
    Default: 10.72.0.0/16
    Description: CIDR for the demo VPC.
  ImageTag:
    Type: String
    Default: demo
    Description: Tag of the corridor/* images in your ECR repository.
  DbPassword:
    Type: String
    NoEcho: true
    Default: CHANGE_ME_BEFORE_USE
    Description: >
      Pattern parameter only. Prefer leaving it unused and sourcing the SQL
      password from Secrets Manager via the {{resolve:secretsmanager:...}}
      references in the task definitions.
  ExecutionRoleArn:
    Type: String
    Default: arn:aws:iam::CHANGE_ME:role/ecsTaskExecutionRole
    Description: >
      Pre existing task execution role allowed to pull ECR images and read
      the Secrets Manager entries referenced below.
  DesiredCount:
    Type: Number
    Default: 1
    Description: Tasks per service.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - { Key: Name, Value: corridor-vpc }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: corridor-igw }

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: corridor-public-a }

  PublicSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: corridor-public-b }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: corridor-public-routes }

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetOneRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetOne

  SubnetTwoRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetTwo

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress for the Corridor demo
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: corridor-alb-sg }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Corridor task ingress from the ALB only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # Container ports: portal 5200, legacy 8000, oktasim 8080.
        - { IpProtocol: tcp, FromPort: 5200, ToPort: 5200, SourceSecurityGroupId: !GetAtt AlbSecurityGroup.GroupId }
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !GetAtt AlbSecurityGroup.GroupId }
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !GetAtt AlbSecurityGroup.GroupId }
      # Egress is open for the demo; in a real deployment restrict TCP 1433
      # egress to the security group or CIDR of YOUR SQL Server (RDS or the
      # VPN endpoint for on-prem).
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: corridor-app-sg }

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: corridor
      Tags:
        - { Key: Name, Value: corridor }

  # Task definitions: awsvpc mode, Fargate compatible. Environment values use
  # Secrets Manager dynamic references (names only, no values in the file).

  PortalTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: corridor-portal
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref ExecutionRoleArn
      ContainerDefinitions:
        - Name: portal
          Essential: true
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/corridor/portal:${ImageTag}
          PortMappings:
            - { ContainerPort: 5200, Protocol: tcp }
          Environment:
            - { Name: ASPNETCORE_ENVIRONMENT, Value: Production }
            - { Name: ASPNETCORE_URLS, Value: "http://+:5200" }
            - Name: ConnectionStrings__Corridor
              Value: !Sub >
                Server=YOUR_SQL_HOST,1433;Database=Corridor;User Id=sa;
                Password={{resolve:secretsmanager:corridor/db/sa-password:SecretString}};
                TrustServerCertificate=True;Encrypt=True
            - { Name: Okta__Authority, Value: "http://corridor-alb-okta" }
            - { Name: Okta__ClientId, Value: portal }
            - Name: Okta__ClientSecret
              Value: "{{resolve:secretsmanager:corridor/portal/client-secret:SecretString}}"
            - { Name: Legacy__OktaClientSecret, Value: "{{resolve:secretsmanager:corridor/legacy/client-secret:SecretString}}" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: portal

  OktaSimTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: corridor-oktasim
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref ExecutionRoleArn
      ContainerDefinitions:
        - Name: oktasim
          Essential: true
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/corridor/oktasim:${ImageTag}
          PortMappings:
            - { ContainerPort: 8080, Protocol: tcp }
          Environment:
            - { Name: ASPNETCORE_ENVIRONMENT, Value: Production }
            - { Name: ASPNETCORE_URLS, Value: "http://+:8080" }
            - Name: ConnectionStrings__Corridor
              Value: !Sub >
                Server=YOUR_SQL_HOST,1433;Database=Corridor;User Id=sa;
                Password={{resolve:secretsmanager:corridor/db/sa-password:SecretString}};
                TrustServerCertificate=True;Encrypt=True
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: oktasim

  LegacyTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: corridor-legacy
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref ExecutionRoleArn
      ContainerDefinitions:
        - Name: legacy
          Essential: true
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/corridor/legacy:${ImageTag}
          PortMappings:
            - { ContainerPort: 8000, Protocol: tcp }
          Environment:
            - { Name: ASPNETCORE_ENVIRONMENT, Value: Production }
            - { Name: ASPNETCORE_URLS, Value: "http://+:8000" }
            - Name: ConnectionStrings__Corridor
              Value: !Sub >
                Server=YOUR_SQL_HOST,1433;Database=Corridor;User Id=sa;
                Password={{resolve:secretsmanager:corridor/db/sa-password:SecretString}};
                TrustServerCertificate=True;Encrypt=True
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: legacy

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/corridor
      RetentionInDays: 30

  # Target groups (all health checked on the anonymous /healthz endpoint).

  PortalTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: corridor-portal
      VpcId: !Ref Vpc
      Port: 5200
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2

  OktaSimTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: corridor-oktasim
      VpcId: !Ref Vpc
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2

  LegacyTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: corridor-legacy
      VpcId: !Ref Vpc
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: corridor-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetOne
        - !Ref PublicSubnetTwo
      SecurityGroups:
        - !GetAtt AlbSecurityGroup.GroupId

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref PortalTargetGroup }

  # Path based routing keeps one ALB for the demo. Note: routing SOAP through
  # a path prefix only works for clients that honor the rewritten address;
  # give legacy its own listener or hostname when you need the raw endpoint.
  OktaSimListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 100
      Conditions:
        - Field: path-pattern
          Values: [/okta*, /scim*, /pdp*, "/.well-known/*"]
      Actions:
        - { Type: forward, TargetGroupArn: !Ref OktaSimTargetGroup }

  LegacyListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 200
      Conditions:
        - Field: path-pattern
          Values: [/TraceLink*]
      Actions:
        - { Type: forward, TargetGroupArn: !Ref LegacyTargetGroup }

  PortalService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: corridor-portal
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      TaskDefinition: !Ref PortalTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetOne
            - !Ref PublicSubnetTwo
          SecurityGroups:
            - !GetAtt AppSecurityGroup.GroupId
      LoadBalancers:
        - ContainerName: portal
          ContainerPort: 5200
          TargetGroupArn: !Ref PortalTargetGroup

  OktaSimService:
    Type: AWS::ECS::Service
    DependsOn: OktaSimListenerRule
    Properties:
      ServiceName: corridor-oktasim
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      TaskDefinition: !Ref OktaSimTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetOne
            - !Ref PublicSubnetTwo
          SecurityGroups:
            - !GetAtt AppSecurityGroup.GroupId
      LoadBalancers:
        - ContainerName: oktasim
          ContainerPort: 8080
          TargetGroupArn: !Ref OktaSimTargetGroup

  LegacyService:
    Type: AWS::ECS::Service
    DependsOn: LegacyListenerRule
    Properties:
      ServiceName: corridor-legacy
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      TaskDefinition: !Ref LegacyTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetOne
            - !Ref PublicSubnetTwo
          SecurityGroups:
            - !GetAtt AppSecurityGroup.GroupId
      LoadBalancers:
        - ContainerName: legacy
          ContainerPort: 8000
          TargetGroupArn: !Ref LegacyTargetGroup

Outputs:
  LoadBalancerDnsName:
    Description: Public DNS name of the Corridor ALB.
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Description: Name of the Corridor ECS cluster.
    Value: !Ref Cluster
