# CI for the Corridor repo. Jobs:
#   build-test  restore, build and unit test the solution (no docker needed)
#   spa         lint, unit test and build the FieldInsight SPA
#   artifacts   parse-check the committed XML/JSON test artifacts
#   integrate   db-only compose stack plus the integration test project
# The unit path never touches docker, so pull requests stay fast and green.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and unit test (net10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: restore
        run: dotnet restore Corridor.slnx
      - name: build
        run: dotnet build Corridor.slnx --no-restore --nologo
      - name: unit test
        # Exclude the integration suite: it needs the docker db stack from the
        # integrate job below, everything here runs plain and container free.
        run: >
          dotnet test Corridor.slnx --no-build --nologo
          --filter "FullyQualifiedName!~IntegrationTests"

  spa:
    name: spa lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Corridor.Spa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Corridor.Spa/package-lock.json
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: unit test
        run: npm test
      - name: build
        run: npm run build

  artifacts:
    name: validate committed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: parse XML and JSON artifacts
        run: |
          python3 - <<'PY'
          import glob, json, os, sys
          import xml.etree.ElementTree as ET

          # Committed tooling artifacts. Missing files are skipped with a
          # warning (they land in the repo via separate changes), malformed
          # files fail the job.
          json_targets = [
              "postman/Corridor.postman_collection.json",
          ]
          xml_targets = [
              "soapui/Corridor-TraceLink-soapui-project.xml",
              "jmeter/corridor-flow.jmx",
          ] + sorted(glob.glob("policies/*.xacml.xml"))

          missing, failed = [], []
          for path in json_targets:
              if not os.path.isfile(path):
                  missing.append(path)
                  continue
              try:
                  with open(path, encoding="utf-8") as handle:
                      json.load(handle)
                  print(f"ok json  {path}")
              except Exception as exc:
                  failed.append(f"{path}: {exc}")
          for path in xml_targets:
              if not os.path.isfile(path):
                  missing.append(path)
                  continue
              try:
                  ET.parse(path)
                  print(f"ok xml   {path}")
              except Exception as exc:
                  failed.append(f"{path}: {exc}")

          if missing:
              print("warning: missing (skipped, not committed yet?):")
              for path in missing:
                  print(f"  {path}")
          if failed:
              print("artifact parse failures:")
              for line in failed:
                  print(f"  {line}")
              sys.exit(1)
          print("artifact validation complete")
          PY

  integrate:
    name: integration tests (compose db)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: restore integration tests
        run: dotnet restore tests/Corridor.IntegrationTests/Corridor.IntegrationTests.csproj
      - name: start db and apply scripts
        run: bash scripts/test-db-only.sh
      - name: integration test
        env:
          ConnectionStrings__Corridor: "Server=localhost,1433;Database=Corridor;User Id=sa;Password=CorridorDev1!;TrustServerCertificate=True;Encrypt=True"
        run: >
          dotnet test tests/Corridor.IntegrationTests/Corridor.IntegrationTests.csproj
          --no-restore --nologo

  api-regression:
    name: api regression (newman)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: start db and apply scripts
        run: bash scripts/test-db-only.sh
      - name: boot services
        env:
          ConnectionStrings__Corridor: "Server=localhost,1433;Database=Corridor;User Id=sa;Password=CorridorDev1!;TrustServerCertificate=True;Encrypt=True"
        run: |
          dotnet run --project src/Corridor.OktaSim --no-launch-profile &
          dotnet run --project src/Corridor.AdfsSim --no-launch-profile &
          dotnet run --project src/Corridor.Legacy --no-launch-profile &
          dotnet run --project src/Corridor.Portal --no-launch-profile &
          for i in $(seq 1 60); do
            ok=1
            for port in 8080 8090 8000 5200; do
              curl -fsS "http://localhost:$port/healthz" >/dev/null 2>&1 || ok=0
            done
            [ "$ok" = 1 ] && break
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "services did not become healthy"; exit 1; }
      - name: flip legacy to dual trust (documented collection prerequisite)
        run: docker exec $(docker ps -qf name=db) /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CorridorDev1! -d Corridor -Q "UPDATE idn.MigrationApps SET TrustMode='Dual' WHERE AppKey='legacy'"
      - name: run the Postman collection
        run: npx --yes newman run postman/Corridor.postman_collection.json -e postman/corridor-env.json --reporters cli
      - name: stop services
        if: always()
        run: pkill -f "Corridor.(OktaSim|AdfsSim|Legacy|Portal)" || true

  e2e:
    name: end to end (playwright)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install playwright chromium
        run: npx --yes playwright@latest install --with-deps chromium
      - name: install e2e dependencies
        run: npm ci
        working-directory: e2e
      - name: install spa dependencies (dev server runs in the suite)
        run: npm ci
        working-directory: src/Corridor.Spa
      - name: run the self-bootstrapping suite
        run: npx playwright test
        working-directory: e2e
