<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" role="img" aria-label="Corridor: an ADFS-to-Okta identity migration - three applications cross from legacy SAML to modern OIDC with no downtime window · sky = identity · emerald = applications · amber = data · rose = operators. Animated flows: colored dashes move along request paths; node borders breathe.">
